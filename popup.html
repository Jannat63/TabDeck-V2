<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Save to TabDeck</title>
<link rel="stylesheet" href="css/fonts.css">
<script src="js/popup-fouc.js"></script>
<link rel="stylesheet" href="css/popup-themes.css">
<link rel="stylesheet" href="css/popup.css">
</head>
<body>

<header class="header">
  <img class="header-logo" src="assets/favicon.png" alt="">
  <span class="header-name">TabDeck</span>
  <span class="header-badge">Save this page</span>
</header>

<div class="page-card">
  <div class="fav-wrap"><img id="pageFavicon" alt="" width="18" height="18"></div>
  <div class="page-info">
    <div class="page-title-text" id="pageTitle">Loading…</div>
    <div class="page-url-text" id="pageUrl"></div>
  </div>
</div>

<form class="form" id="mainForm" autocomplete="off">
  <label class="field">
    <span class="field-label">Title</span>
    <input type="text" id="titleInput" placeholder="Page title" spellcheck="false">
  </label>

  <label class="field">
    <span class="field-label">Workspace</span>
    <select id="wsSelect"></select>
  </label>

  <div class="field">
    <span class="field-label" id="destLabel">Save to</span>
    <div class="seg" role="group" aria-labelledby="destLabel">
      <button type="button" class="seg-btn active" id="destQuick" aria-pressed="true">Quick Access</button>
      <button type="button" class="seg-btn" id="destFolder" aria-pressed="false">Folder</button>
    </div>
  </div>

  <label class="field" id="folderRow" hidden>
    <span class="field-label">Folder</span>
    <select id="folderSelect"></select>
  </label>

  <label class="field" id="newFolderRow" hidden>
    <span class="field-label">New folder name</span>
    <input type="text" id="newFolderInput" placeholder="e.g. Design" maxlength="60">
  </label>

  <p class="notice" id="notice" role="status" hidden></p>

  <button class="save-btn" id="saveBtn" type="submit">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="20,6 9,17 4,12"/></svg>
    <span id="saveLabel">Save</span>
  </button>
</form>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/popup.js"></script>
</body>
</html>
